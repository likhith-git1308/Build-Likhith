name: build_likhith
description: Production-ready mobile app helping students choose software career paths and get hired.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.10
  flutter_riverpod: ^2.4.10
  riverpod_generator: ^2.3.10
  
  # Firebase
  firebase_core: ^2.28.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.8.0
  firebase_analytics: ^10.8.0
  firebase_remote_config: ^4.4.0
  firebase_crashlytics: ^3.5.0
  
  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0
  
  # Local Storage
  sqflite: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  
  # Authentication & Security
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  
  # Payments
  razorpay_flutter: ^1.3.8
  
  # UI & Animations
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  animations: ^2.0.11
  flutter_staggered_animations: ^0.1.3
  
  # Charts & Analytics
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^23.2.36
  
  # Navigation
  go_router: ^14.2.0
  
  # Forms & Validation
  reactive_forms: ^16.1.0
  email_validator: ^2.1.17
  
  # DateTime
  intl: ^0.19.0
  table_calendar: ^3.1.2
  
  # Video & Media
  video_player: ^2.8.5
  image_picker: ^1.1.2
  photo_view: ^0.14.0
  
  # WebView
  webview_flutter: ^4.8.0
  
  # Connectivity
  connectivity_plus: ^5.1.0
  
  # Device Info
  device_info_plus: ^10.1.2
  package_info_plus: ^7.0.0
  
  # Analytics & Tracking
  amplitude_flutter: ^4.7.0
  
  # Push Notifications
  flutter_local_notifications: ^17.1.2
  
  # Logging
  logger: ^2.4.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # PDF Export
  pdf: ^3.10.7
  printing: ^5.11.3
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Language
  easy_localization: ^3.0.7
  
  # Accessibility
  flutter_accessible_video_player: ^1.0.5
  
  dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.10
  riverpod_generator: ^2.3.10
  retrofit_generator: ^7.0.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/svg/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - .env
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  image_path_android: "assets/images/app_icon_android.png"
  image_path_ios: "assets/images/app_icon_ios.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  android: true
  ios: true
