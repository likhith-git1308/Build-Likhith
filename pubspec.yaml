name: build_likhith
description: Production-ready mobile app helping students choose software career paths and get hired.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  riverpod: ^2.4.10
  flutter_riverpod: ^2.4.10
  
  firebase_core: ^2.28.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.8.0
  firebase_analytics: ^10.8.0
  firebase_remote_config: ^4.4.0
  firebase_crashlytics: ^3.5.0
  
  dio: ^5.4.0
  retrofit: ^4.1.0
  
  sqflite: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  
  razorpay_flutter: ^1.3.8
  
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  animations: ^2.0.11
  flutter_staggered_animations: ^0.1.3
  
  fl_chart: ^0.68.0
  
  go_router: ^14.2.0
  
  reactive_forms: ^16.1.0
  email_validator: ^2.1.17
  
  intl: ^0.19.0
  table_calendar: ^3.1.2
  
  video_player: ^2.8.5
  image_picker: ^1.1.2
  photo_view: ^0.14.0
  
  webview_flutter: ^4.8.0
  
  connectivity_plus: ^5.1.0
  
  device_info_plus: ^10.1.2
  package_info_plus: ^7.0.0
  
  logger: ^2.4.0
  
  flutter_dotenv: ^5.1.0
  
  pdf: ^3.10.7
  printing: ^5.11.3
  
  qr_flutter: ^4.1.0
  
  easy_localization: ^3.0.7
  
  local_auth: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  
  mockito: ^5.4.4
  build_runner: ^2.4.10
  riverpod_generator: ^2.3.10
  retrofit_generator: ^7.0.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/svg/
    - assets/icons/
    - assets/animations/
    - .env
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
